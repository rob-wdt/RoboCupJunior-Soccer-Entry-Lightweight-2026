[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

build_flags = 
    ;System
    -I"C:\Users\rober\.platformio\packages\framework-arduino-avr\libraries\Wire\src"
    ;MPU6050
    -I"C:\Users\rober\OneDrive\Документы\Arduino\libraries\MPU6050\src"
    ;BNO055
    -I"C:\Users\rober\OneDrive\Документы\Arduino\libraries\Adafruit_Unified_Sensor"
    -I"C:\Users\rober\OneDrive\Документы\Arduino\libraries\Adafruit_BNO055"
    -I"C:\Users\rober\OneDrive\Документы\Arduino\libraries\Adafruit_BusIO"
    ;IR SEEKER
    -I"C:\Users\rober\OneDrive\Документы\Arduino\libraries\HTInfraredSeeker-master"

lib_ldf_mode = deep+

lib_deps = 
    ;MPU6050
    electroniccats/MPU6050 @ 1.3.1
    ;BNO055
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    ;System
    Wire
    
monitor_speed = 115200